name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Rebuild without dependency or Docker build caches
        type: boolean
        default: false
      asvs_validation:
        description: Run the isolated ASVS API, browser and pipeline verification workflow
        type: boolean
        default: false
      runtime_validation:
        description: Rehearse isolated rollback and observe the full stack for one hour after all CI gates pass
        type: boolean
        default: false

# Every third-party action below is pinned to a full commit SHA. Renovate keeps
# these pins current; do not replace them with a mutable tag.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Block newly introduced high-severity dependencies
        uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3 # v4.8.0
        with:
          fail-on-severity: high

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: ${{ inputs.cold_cache != true && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests and coverage baseline gate
        run: npm run test:coverage
      - name: Build production bundle
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend tests and migration integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ inputs.cold_cache != true && 'maven' || '' }}
      - name: Run tests
        run: mvn -B -ntp verify
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-jacoco-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-results
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

  desktop-client:
    name: JavaFX SIEM client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ inputs.cold_cache != true && 'maven' || '' }}
      - name: Install headless display runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
      - name: Test and package the Linux application under Xvfb
        id: package
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ./scripts/package-linux.sh
      - name: Smoke-test the packaged executable at laptop and desktop sizes
        env:
          APPLICATION_ARCHIVE: ${{ steps.package.outputs.application_archive }}
        run: |
          set -Eeuo pipefail
          (cd "$(dirname "$APPLICATION_ARCHIVE")" && sha256sum -c "$(basename "$APPLICATION_ARCHIVE").sha256")
          extracted_image="$(mktemp -d)"
          trap 'rm -rf -- "$extracted_image"' EXIT
          tar -xzf "$APPLICATION_ARCHIVE" -C "$extracted_image"
          xvfb-run -a -s '-screen 0 1366x768x24' ./scripts/smoke-linux.sh "$extracted_image/FlareSecurityMonitor"
          xvfb-run -a -s '-screen 0 1920x1080x24' ./scripts/smoke-linux.sh "$extracted_image/FlareSecurityMonitor"
      - name: Upload the tested application image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flare-soc-linux-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.application_archive }}
            ${{ steps.package.outputs.application_archive }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-test-results
          path: desktop-client/target/dist-release.*/test-reports
          if-no-files-found: ignore
          retention-days: 14

  prevention-gateway:
    name: Coraza prevention gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build gateway image and run its rule/proxy tests
        run: docker build ${{ inputs.cold_cache && '--no-cache' || '' }} --pull=false --tag flare-prevention-gateway:ci gateway

  ueba-worker:
    name: UEBA worker and cross-language contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned worker image
        run: docker build ${{ inputs.cold_cache && '--no-cache' || '' }} --pull=false --tag flare-ueba-worker:local ueba-worker
      - name: Build the separate worker test image
        run: docker build --file ueba-worker/Dockerfile.test --tag flare-ueba-worker:test ueba-worker
      - name: Test real worker HTTP, model lifecycle and body limit
        # Cross-repo frozen-protocol tests read these source trees by absolute path.
        # Mount only required code, read-only; never expose observability runtime/secrets.
        # The package format requires UID/GID 1000; chown only this disposable copy.
        run: |
          set -Eeuo pipefail
          test_workspace="$(mktemp -d)"
          mkdir -p "$test_workspace/ueba-worker" "$test_workspace/backend" "$test_workspace/observability"
          cp -R ueba-worker/app "$test_workspace/ueba-worker/"
          cp -R backend/src "$test_workspace/backend/"
          cp -R observability/scripts "$test_workspace/observability/"
          trap 'sudo rm -rf -- "$test_workspace"' EXIT
          docker run --rm --network none --user 0:0 -v "$test_workspace:/workspace" \
            --entrypoint chown flare-ueba-worker:test -R 1000:1000 /workspace
          docker run --rm --network none \
            --user 1000:1000 \
            -v "$PWD/ueba-worker:/code:ro" \
            -v "$PWD/ueba-worker/app:/ueba-worker/app:ro" \
            -v "$PWD/backend/src:/backend/src:ro" \
            -v "$PWD/observability/scripts:/observability/scripts:ro" \
            -v "$test_workspace:/workspace:ro" \
            -w /code -e PYTHONPATH=/code:/code/tests \
            -e UEBA_RECOVERY_PROJECT_ROOT=/workspace \
            --entrypoint python flare-ueba-worker:test \
          -m pytest -p no:cacheprovider tests -v
      - name: Test deterministic local demo generator
        run: python3 -m unittest discover -s observability/tests -p 'test_seed_ueba_demo.py' -v
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ inputs.cold_cache != true && 'maven' || '' }}
          cache-dependency-path: backend/pom.xml
      - name: Test Spring-to-Python scoring with isolated MySQL and Redis
        working-directory: backend
        env:
          RUN_LOCAL_UEBA_WORKER: 'true'
        run: mvn -B -ntp -Dtest=UebaModelEndToEndLocalTest test

  dependency-audit:
    name: Maven dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRUSTED_NVD_AUDIT: ${{ (github.event_name == 'push' && github.actor != 'dependabot[bot]') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Explain the untrusted pull-request audit policy
        if: env.TRUSTED_NVD_AUDIT != 'true'
        working-directory: ${{ github.workspace }}
        run: >-
          echo "::notice title=NVD audit deferred::Fork and Dependabot-triggered workflows do not receive repository Actions secrets. Dependency review still runs where available; the keyed NVD audit runs after a trusted non-Dependabot push or through workflow_dispatch."
      - name: Check out source
        if: env.TRUSTED_NVD_AUDIT == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        if: env.TRUSTED_NVD_AUDIT == 'true'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ inputs.cold_cache != true && 'maven' || '' }}
      - name: Build the daily Dependency-Check cache key
        if: env.TRUSTED_NVD_AUDIT == 'true'
        id: dependency-check-cache-key
        run: echo "day=$(/bin/date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the Dependency-Check vulnerability database
        if: env.TRUSTED_NVD_AUDIT == 'true'
        id: dependency-check-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-v12-${{ hashFiles('backend/pom.xml') }}-${{ steps.dependency-check-cache-key.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-${{ hashFiles('backend/pom.xml') }}-
            ${{ runner.os }}-dependency-check-v12-
      - name: Update the Dependency-Check vulnerability database
        if: env.TRUSTED_NVD_AUDIT == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          test -n "$NVD_API_KEY" ||
          { echo "::error title=Missing NVD API key::Add an NVD_API_KEY repository secret so Dependency-Check can update without exceeding NVD rate limits."; exit 1; };
          mvn -B -ntp org.owasp:dependency-check-maven:12.2.2:update-only
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DdataDirectory=${{ runner.temp }}/dependency-check-data
          -DnvdValidForHours=24
      - name: Save the updated Dependency-Check vulnerability database
        if: env.TRUSTED_NVD_AUDIT == 'true' && steps.dependency-check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-v12-${{ hashFiles('backend/pom.xml') }}-${{ steps.dependency-check-cache-key.outputs.day }}
      - name: Scan Maven dependencies for CVEs
        if: env.TRUSTED_NVD_AUDIT == 'true'
        run: >-
          mvn -B -ntp org.owasp:dependency-check-maven:12.2.2:check
          -DautoUpdate=false
          -DdataDirectory=${{ runner.temp }}/dependency-check-data
          -DfailBuildOnCVSS=7
          -Dformats=HTML,JSON
          -DsuppressionFile=dependency-check-suppression.xml
      - name: Upload dependency audit report
        if: always() && env.TRUSTED_NVD_AUDIT == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 14

  edge-security:
    name: Nginx configuration and header hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose interpolation
        run: sh scripts/verify-compose-hardening.sh
      - name: Exercise Docker ownership and logrotate regressions
        env:
          RUNTIME_REGRESSION_PROJECT_NAME: pbl4-regression-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/verify-docker-runtime-regressions.sh
      - name: Exercise Redis volume migration and rollback
        env:
          REDIS_MIGRATION_TEST_PROJECT_NAME: pbl4-redis-migration-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/verify-redis-volume-migration.sh
      - name: Validate Nginx runtime configuration
        run: |
          docker build --tag flare-nginx-config-test --file nginx/Dockerfile .
          docker run --rm flare-nginx-config-test nginx -t
      - name: Validate rendered Nginx configuration and security headers
        run: sh nginx/test-hardening.sh

  observability-config:
    name: Observability configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: pbl4-observability-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate ephemeral PKI and product keystores
        run: observability/scripts/bootstrap-secrets.sh
      - name: Lint observability shell entrypoints
        run: >-
          docker run --rm --network none --entrypoint shellcheck
          -v "$GITHUB_WORKSPACE:/mnt:ro" -w /mnt
          koalaman/shellcheck-alpine:stable@sha256:c82fe42504fbc9fc68f15d36638e5ee2324ebb8b94e96a3c4e395bf361c49183
          observability/scripts/replay-5xx-fixture.sh
          observability/scripts/traffic-normal.sh
          observability/scripts/traffic-abnormal-owned-lab.sh
          observability/scripts/traffic-5xx-owned-aws.sh
          observability/scripts/test-owned-traffic-contracts.sh
          observability/scripts/verify-aws-lab.sh
          observability/scripts/validate-config.sh
          observability/scripts/deploy-web.sh
          observability/scripts/local-lab.sh
          observability/scripts/backup-local-db.sh
          observability/scripts/aws-compose.sh
          observability/scripts/bootstrap-aws-admin.sh
          observability/scripts/check-aws-readiness.sh
          observability/scripts/fetch-aws-web-bundle.sh
          observability/scripts/snapshot-local-release.sh
          observability/scripts/deploy-monitor.sh
          observability/scripts/backup-kibana-before-import.sh
          observability/scripts/bootstrap-ueba.sh
          observability/scripts/verify-ueba-demo.sh
          observability/scripts/migrate-redis-volume.sh
          observability/scripts/verify-local-lab.sh
          observability/scripts/verify-logrotate-continuity.sh
          observability/scripts/verify-stack-recovery.sh
          observability/scripts/create-evidence.sh
          scripts/verify-docker-runtime-regressions.sh
          scripts/verify-redis-volume-migration.sh
          observability/scripts/verify-ci-backend-rollback.sh
      - name: Exercise owned traffic script contracts
        run: observability/scripts/test-owned-traffic-contracts.sh
      - name: Test fail-closed Kibana pre-import backup
        run: python3 -m unittest discover -s observability/tests -p 'test_kibana_preimport_backup.py' -v
      - name: Test isolated runtime stability verdicts
        run: python3 -m unittest discover -s observability/tests -p 'test_ci_runtime_soak.py' -v
      - name: Test AWS composition and operator safety contracts
        run: python3 -m unittest discover -s observability/tests -p 'test_aws_delivery.py' -v
      - name: Validate Compose, Filebeat, Logstash, JSON and saved objects
        run: observability/scripts/validate-config.sh
      - name: Remove ephemeral secrets
        if: always()
        run: rm -rf .secrets/observability

  terraform:
    name: Terraform formatting, validation and IaC scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check
      - name: Initialize the pinned provider without a state backend
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate Terraform configuration
        run: terraform validate
      - name: Test the mocked AWS lab contract
        run: terraform test
      - name: Scan Terraform misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: '1'

  e2e:
    name: Playwright desktop and mobile E2E
    needs: backend
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: pbl4-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://127.0.0.1:8088
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: ${{ inputs.cold_cache != true && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install the version-matched Playwright Chromium runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prove the Nginx log initializer is repeatable
        run: |
          docker compose --env-file .env.e2e.example -f docker-compose.yml -f docker-compose.e2e.yml up --no-deps --force-recreate nginx-logs-init
          docker compose --env-file .env.e2e.example -f docker-compose.yml -f docker-compose.e2e.yml up --no-deps --force-recreate nginx-logs-init
      - name: Start isolated E2E stack
        run: >-
          docker compose --env-file .env.e2e.example
          -f docker-compose.yml -f docker-compose.e2e.yml
          up --detach --build --wait --wait-timeout 180
      - name: Run desktop and mobile browser tests
        working-directory: frontend
        run: |
          npm run build
          npm run test:e2e
      - name: Capture E2E service logs
        if: failure()
        run: >-
          docker compose --env-file .env.e2e.example
          -f docker-compose.yml -f docker-compose.e2e.yml
          logs --no-color > e2e-compose.log
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            e2e-compose.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down E2E stack
        if: always()
        run: >-
          docker compose --env-file .env.e2e.example
          -f docker-compose.yml -f docker-compose.e2e.yml
          down --volumes --remove-orphans

  supply-chain:
    name: Container, filesystem, and SBOM checks
    needs: [frontend, backend, ueba-worker, prevention-gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build backend image
        run: docker build ${{ inputs.cold_cache && '--no-cache' || '' }} --pull=false --tag flarefitness-backend:ci backend
      - name: Build edge image
        run: docker build ${{ inputs.cold_cache && '--no-cache' || '' }} --pull=false --tag flarefitness-nginx:ci --file nginx/Dockerfile .
      - name: Build UEBA worker image
        run: docker build ${{ inputs.cold_cache && '--no-cache' || '' }} --pull=false --tag flare-ueba-worker:ci ueba-worker
      - name: Build prevention gateway image
        id: images-ready
        run: docker build ${{ inputs.cold_cache && '--no-cache' || '' }} --pull=false --tag flare-prevention-gateway:ci gateway
      - name: Scan repository dependencies, secrets, and configuration
        if: always() && steps.images-ready.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan backend container image
        if: always() && steps.images-ready.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flarefitness-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan edge container image
        if: always() && steps.images-ready.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flarefitness-nginx:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan UEBA worker container image
        if: always() && steps.images-ready.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flare-ueba-worker:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan prevention gateway container image
        if: always() && steps.images-ready.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: flare-prevention-gateway:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate backend SBOM
        if: always() && steps.images-ready.outcome == 'success'
        uses: anchore/sbom-action@aa0e114b2e19480f157109b9922bda359bd98b90 # v0.20.8
        with:
          image: flarefitness-backend:ci
          format: cyclonedx-json
          artifact-name: backend-sbom.cdx.json
          output-file: backend-sbom.cdx.json
          upload-artifact-retention: 30
      - name: Generate edge SBOM
        if: always() && steps.images-ready.outcome == 'success'
        uses: anchore/sbom-action@aa0e114b2e19480f157109b9922bda359bd98b90 # v0.20.8
        with:
          image: flarefitness-nginx:ci
          format: cyclonedx-json
          artifact-name: edge-sbom.cdx.json
          output-file: edge-sbom.cdx.json
          upload-artifact-retention: 30
      - name: Generate worker SBOM
        if: always() && steps.images-ready.outcome == 'success'
        uses: anchore/sbom-action@aa0e114b2e19480f157109b9922bda359bd98b90 # v0.20.8
        with:
          image: flare-ueba-worker:ci
          format: cyclonedx-json
          artifact-name: worker-sbom.cdx.json
          output-file: worker-sbom.cdx.json
          upload-artifact-retention: 30
      - name: Generate gateway SBOM
        if: always() && steps.images-ready.outcome == 'success'
        uses: anchore/sbom-action@aa0e114b2e19480f157109b9922bda359bd98b90 # v0.20.8
        with:
          image: flare-prevention-gateway:ci
          format: cyclonedx-json
          artifact-name: gateway-sbom.cdx.json
          output-file: gateway-sbom.cdx.json
          upload-artifact-retention: 30

  asvs-security:
    name: ASVS security verification
    if: github.event_name == 'workflow_dispatch' && inputs.asvs_validation == true
    uses: ./.github/workflows/security-asvs.yml

  release-runtime:
    name: Isolated release rollback and one-hour runtime gate
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.runtime_validation == true
      && needs['frontend'].result == 'success'
      && needs['backend'].result == 'success'
      && needs['desktop-client'].result == 'success'
      && needs['prevention-gateway'].result == 'success'
      && needs['ueba-worker'].result == 'success'
      && needs['dependency-audit'].result == 'success'
      && needs['edge-security'].result == 'success'
      && needs['observability-config'].result == 'success'
      && needs['terraform'].result == 'success'
      && needs['e2e'].result == 'success'
      && needs['supply-chain'].result == 'success'
      && (inputs.asvs_validation != true || needs['asvs-security'].result == 'success')
    needs: [frontend, backend, desktop-client, prevention-gateway, ueba-worker, dependency-audit, edge-security, observability-config, terraform, e2e, supply-chain, asvs-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: pbl4-observability-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      LOCAL_LAB_WEB_PORT: '8088'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reclaim unused SDK space on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          du -sh /usr/local/lib/android /usr/share/dotnet /opt/ghc 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Admit the isolated full stack only with sufficient resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          memory = {row.split()[0].rstrip(':'): int(row.split()[1]) * 1024
                    for row in Path('/proc/meminfo').read_text().splitlines() if row.startswith(('MemTotal:', 'MemAvailable:'))}
          gib = 1024 ** 3
          disk = shutil.disk_usage('.').free
          print({key: round(value/gib, 2) for key, value in {**memory, 'disk_free': disk}.items()})
          if memory['MemTotal'] < 14*gib or memory['MemAvailable'] < 12*gib or disk < 30*gib:
              raise SystemExit('Full ELK admission refused: need 14 GiB total RAM, 12 GiB available and 30 GiB free disk.')
          PY
      - name: Generate isolated observability secrets
        run: observability/scripts/bootstrap-secrets.sh
      - name: Validate image-native configuration
        run: observability/scripts/validate-config.sh
      - name: Start the isolated full stack
        run: observability/scripts/local-lab.sh up
      - name: Verify ELK, GeoIP, queues, dashboards and rules
        run: observability/scripts/local-lab.sh verify
      - name: Verify logrotate and Filebeat continuity
        run: observability/scripts/verify-logrotate-continuity.sh
      - name: Verify complete restart recovery
        run: observability/scripts/verify-stack-recovery.sh
      - name: Check out the immutable rollback baseline
        if: inputs.runtime_validation == true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d7bee8aaddab809e05b010deca69433f9c85d835
          path: rollback-baseline
          sparse-checkout: backend
          persist-credentials: false
      - name: Rehearse backend binary rollback on the synthetic database
        if: inputs.runtime_validation == true
        run: observability/scripts/verify-ci-backend-rollback.sh "$GITHUB_WORKSPACE/rollback-baseline"
      - name: Observe one hour without unexpected restarts or HTTP failures
        if: inputs.runtime_validation == true
        run: python3 observability/scripts/verify-ci-runtime-soak.py --output observability/runtime/ci-stability-result.json
      - name: Recheck ingestion after the stability interval
        if: inputs.runtime_validation == true
        run: observability/scripts/local-lab.sh verify
      - name: Capture sanitized diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p observability/runtime
          docker compose --env-file .env.e2e.example --project-name "$COMPOSE_PROJECT_NAME" --profile observability \
            -f docker-compose.yml -f docker-compose.e2e.yml \
            -f observability/docker-compose.monitor.yml -f observability/docker-compose.local.yml \
            ps --all > observability/runtime/ci-compose-ps.txt 2>&1 || true
          docker compose --env-file .env.e2e.example --project-name "$COMPOSE_PROJECT_NAME" --profile observability \
            -f docker-compose.yml -f docker-compose.e2e.yml \
            -f observability/docker-compose.monitor.yml -f observability/docker-compose.local.yml \
            logs --no-color --timestamps > observability/runtime/ci-compose-logs.txt 2>&1 || true
          for secret_file in .secrets/observability/monitor/*.password; do
            [ -f "$secret_file" ] || continue
            secret=$(<"$secret_file")
            [ -z "$secret" ] || sed -i "s/${secret}/[REDACTED]/g" observability/runtime/ci-compose-logs.txt
          done
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observability-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            observability/runtime/ci-compose-ps.txt
            observability/runtime/ci-compose-logs.txt
            observability/runtime/ci-stability-result.json
            observability/runtime/ci-rollback-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down only the isolated runtime project
        if: always()
        env:
          LOCAL_LAB_PURGE_CONFIRM: 'yes'
        run: observability/scripts/local-lab.sh purge
