# Disposable CI only. Never merge with the protected local project's release.
services:
  app:
    cpus: 1
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: '-Xmx640m -XX:ActiveProcessorCount=1'
      APP_AUTH_COOKIE_SECURE: 'true'
      APP_LOGIN_OTP_ENABLED: 'true'
      APP_SESSION_IDLE_SECONDS: '900'
      APP_JWT_EXPIRATION_SECONDS: '28800'
      APP_CORS_ALLOWED_ORIGINS: 'https://app.soc.test:8443'
      APP_SECURITY_LOGIN_MAX_ATTEMPTS_PER_MINUTE: '5'
      APP_SECURITY_LOGIN_MAX_ACCOUNT_ATTEMPTS_PER_MINUTE: '5'
  mailpit:
    ports: !override ['127.0.0.1:8025:8025']
  nginx:
    environment:
      NGINX_PUBLIC_SERVER_NAME: app.soc.test
  tls-edge:
    image: nginx:1.30.6-alpine-slim@sha256:dede8895648b461178c3bc604f7eed4423efe5220b2c4d839f5eb3d34ac3f8f7
    user: '101:101'
    entrypoint: ['nginx']
    command: ['-c', '/etc/nginx/asvs.conf', '-g', 'daemon off;']
    volumes:
      - ${OBSERVABILITY_ROOT_DIR:?}/security/asvs/tls/nginx.conf:/etc/nginx/asvs.conf:ro
      - ${ASVS_TLS_DIR:?}/server.crt:/run/asvs/server.crt:ro
      - ${ASVS_TLS_DIR:?}/server.key:/run/asvs/server.key:ro
    ports: ['127.0.0.1:8443:8443']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,mode=0700,uid=101,gid=101']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: '0.5'
    networks:
      flare-internal: {}
      asvs-scanner:
        aliases: [app.soc.test, attacker.test]
networks:
  asvs-scanner:
    internal: true
