# Disposable CI only. Never merge with the protected local project's release.
services:
  app:
    cpus: 1
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: '-Xmx640m -XX:ActiveProcessorCount=1'
      APP_AUTH_COOKIE_SECURE: 'true'
      APP_LOGIN_OTP_ENABLED: 'true'
      APP_SESSION_IDLE_SECONDS: '900'
      APP_JWT_EXPIRATION_SECONDS: '28800'
      APP_CORS_ALLOWED_ORIGINS: 'https://app.soc.test:8443'
      APP_SECURITY_LOGIN_MAX_ATTEMPTS_PER_MINUTE: '5'
      APP_SECURITY_LOGIN_MAX_ACCOUNT_ATTEMPTS_PER_MINUTE: '5'
  mailpit:
    ports: !override ['127.0.0.1:8025:8025']
  nginx:
    environment:
      NGINX_PUBLIC_SERVER_NAME: app.soc.test
  gateway:
    environment:
      # Trust this single disposable terminator, never the whole app network.
      PREVENTION_TRUSTED_PROXY_CIDRS: '${ASVS_TLS_EDGE_PRIVATE_IP:-172.31.0.51}/32'
  tls-edge:
    image: flare-asvs-tls-edge:ci
    build:
      context: ${OBSERVABILITY_ROOT_DIR:?}
      dockerfile: nginx/Dockerfile
      target: diagnostics-runtime
    user: '101:101'
    entrypoint: ['/usr/local/bin/nginx-diagnostics']
    command: ['nginx', '-c', '/etc/nginx/asvs.conf', '-g', 'daemon off;']
    environment:
      NGINX_DIAGNOSTICS_MAX_BYTES: '1048576'
    volumes:
      - ${OBSERVABILITY_ROOT_DIR:?}/security/asvs/tls/nginx.conf:/etc/nginx/asvs.conf:ro
      - ${ASVS_TLS_DIR:?}/server.crt:/run/asvs/server.crt:ro
      - ${ASVS_TLS_DIR:?}/server.key:/run/asvs/server.key:ro
    ports: ['127.0.0.1:8443:8443']
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=0700,uid=101,gid=101
      - /var/log/nginx:rw,noexec,nosuid,size=4m,mode=0700,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: '0.5'
    networks:
      flare-internal:
        # The default matches .env.e2e.example. Override explicitly for custom subnets.
        ipv4_address: ${ASVS_TLS_EDGE_PRIVATE_IP:-172.31.0.51}
      asvs-scanner:
        aliases: [app.soc.test, attacker.test]
networks:
  asvs-scanner:
    internal: true
