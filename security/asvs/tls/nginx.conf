pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/asvs/server.crt;
    ssl_certificate_key /run/asvs/server.key;
    server {
        listen 8443 ssl;
        server_name app.soc.test;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location / {
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://gateway:8082;
            proxy_set_header Host app.soc.test;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
    server {
        listen 8443 ssl;
        server_name attacker.test;
        default_type text/html;
        location / { return 200 '<!doctype html><title>Isolated other origin</title>'; }
    }
}
