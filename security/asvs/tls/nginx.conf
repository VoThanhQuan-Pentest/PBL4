pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    charset utf-8;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_certificate /run/asvs/server.crt;
    ssl_certificate_key /run/asvs/server.key;
    # Preserve the application's full policy (including its stylesheet/font
    # sources); edge-generated errors have no upstream policy or active content.
    map $upstream_http_content_security_policy $response_csp {
        default $upstream_http_content_security_policy;
        "" "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'";
    }
    server {
        listen 8443 ssl;
        server_name app.soc.test;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $response_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location / {
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_pass http://gateway:8082;
            proxy_set_header Host app.soc.test;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
    server {
        listen 8443 ssl;
        server_name attacker.test;
        default_type text/html;
        location / { return 200 '<!doctype html><title>Isolated other origin</title>'; }
    }
}
