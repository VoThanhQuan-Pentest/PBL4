# Local OTP rollout only; merge after docker-compose.yml.
# Requires Docker Compose >= 2.24.4 for !override.
services:
  app:
    cpus: 2
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx640m -XX:ActiveProcessorCount=2"
      SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "${OTP_LOCAL_FLYWAY_IGNORE_MIGRATION_PATTERNS:-*:future}"
      APP_SENSITIVE_ACTION_CONFIRMATION_ENABLED: ${APP_SENSITIVE_ACTION_CONFIRMATION_ENABLED:-false}
      APP_SENSITIVE_ACTION_CONFIRMATION_ACCOUNT_ALLOWLIST: ${APP_SENSITIVE_ACTION_CONFIRMATION_ACCOUNT_ALLOWLIST:-}
  db:
    cpus: 1
    mem_limit: 768m
  redis:
    cpus: 0.5
    mem_limit: 128m
  nginx:
    ports: !override
      - "127.0.0.1:${OTP_LOCAL_HTTP_PORT:-8088}:80"
